<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8590"/></marker></defs><rect x="20" y="74" width="160" height="112" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><text x="40" y="110" font-size="17" font-weight="650" fill="#F0F6FC">You direct</text><text x="40" y="140" font-size="14" fill="#9198A1">Describe a scene,</text><text x="40" y="160" font-size="14" fill="#9198A1">share references</text><path d="M184 130.0 H204" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><rect x="210" y="74" width="160" height="112" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><text x="230" y="110" font-size="17" font-weight="650" fill="#F0F6FC">Agent builds</text><text x="230" y="140" font-size="14" fill="#9198A1">Comps, layers,</text><text x="230" y="160" font-size="14" fill="#9198A1">keyframes, effects</text><path d="M374 130.0 H394" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><rect x="400" y="74" width="160" height="112" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><text x="420" y="110" font-size="17" font-weight="650" fill="#F0F6FC">Agent checks</text><text x="420" y="140" font-size="14" fill="#9198A1">Looks at the</text><text x="420" y="160" font-size="14" fill="#9198A1">frames it made</text><path d="M564 130.0 H584" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><rect x="590" y="74" width="160" height="112" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><text x="610" y="110" font-size="17" font-weight="650" fill="#F0F6FC">You review</text><text x="610" y="140" font-size="14" fill="#9198A1">Watch it in</text><text x="610" y="160" font-size="14" fill="#9198A1">After Effects</text><path d="M754 130.0 H774" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><rect x="780" y="74" width="160" height="112" rx="12" fill="#121D2F" stroke="#4493F8" stroke-width="1.5"/><text x="800" y="110" font-size="17" font-weight="650" fill="#F0F6FC">Render</text><text x="800" y="140" font-size="14" fill="#9198A1">The final video</text><path d="M480.0 70 V44 H290.0 V66" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><text x="385.0" y="34" text-anchor="middle" font-size="14" fill="#9198A1">fixes anything that looks off</text><path d="M670.0 190 V220 H290.0 V194" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><text x="480.0" y="244" text-anchor="middle" font-size="14" fill="#9198A1">your notes go back to the agent</text></svg>
