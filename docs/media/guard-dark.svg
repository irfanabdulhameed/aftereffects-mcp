<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8590"/></marker></defs><rect x="20" y="20" width="300" height="64" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="52" cy="50" r="13" fill="#4493F8"/><text x="52" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text><text x="74" y="56" font-size="17" font-weight="650" fill="#F0F6FC">Is After Effects open?</text><path d="M324 52.0 H366" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><text x="380" y="57.0" font-size="14.5" fill="#9198A1"><tspan font-weight="650" fill="#F0F6FC">Not open:</tspan> it stops and tells you. It never starts After Effects by itself.</text><path d="M170.0 88 V104" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><text x="180.0" y="102" text-anchor="start" font-size="12.5" fill="#9198A1">OK</text><rect x="20" y="110" width="300" height="64" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="52" cy="140" r="13" fill="#4493F8"/><text x="52" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text><text x="74" y="146" font-size="17" font-weight="650" fill="#F0F6FC">Is anyone else using it?</text><path d="M324 142.0 H366" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><text x="380" y="147.0" font-size="14.5" fill="#9198A1"><tspan font-weight="650" fill="#F0F6FC">In use:</tspan> it waits its turn.</text><path d="M170.0 178 V194" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><text x="180.0" y="192" text-anchor="start" font-size="12.5" fill="#9198A1">OK</text><rect x="20" y="200" width="300" height="64" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="52" cy="230" r="13" fill="#4493F8"/><text x="52" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text><text x="74" y="236" font-size="17" font-weight="650" fill="#F0F6FC">Is a popup in the way?</text><path d="M324 232.0 H366" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><text x="380" y="227.0" font-size="14.5" fill="#9198A1"><tspan font-weight="650" fill="#F0F6FC">Popup:</tspan> a simple message is closed for you, only while After Effects is in</text><text x="380" y="248.0" font-size="14.5" fill="#9198A1">the background. Anything else: it stops and tells you.</text><path d="M170.0 268 V284" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><text x="180.0" y="282" text-anchor="start" font-size="12.5" fill="#9198A1">OK</text><rect x="20" y="290" width="300" height="80" rx="12" fill="#121D2F" stroke="#4493F8" stroke-width="1.5"/><text x="40" y="326" font-size="17" font-weight="650" fill="#F0F6FC">Runs the step</text><text x="380" y="320" font-size="14.5" fill="#9198A1"><tspan font-weight="650" fill="#F0F6FC">While it runs:</tspan> popups stay switched off, so an error comes back to the agent</text><text x="380" y="341" text-anchor="start" font-size="14.5" fill="#9198A1">as text instead of stopping After Effects.</text></svg>
