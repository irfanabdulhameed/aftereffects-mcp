<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818B98"/></marker></defs><rect x="20" y="20" width="376" height="170" rx="12" fill="#EEF4FF" stroke="#2F6FEB" stroke-width="1.5"/><circle cx="52" cy="50" r="13" fill="#2F6FEB"/><text x="52" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text><text x="74" y="56" font-size="17" font-weight="650" fill="#1F2328">Batching</text><text x="40" y="86" font-size="14" fill="#59636E">Many steps in one round-trip</text><text x="40" y="106" font-size="14" fill="#59636E">and one undo step.</text><rect x="416" y="20" width="376" height="170" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1.5"/><circle cx="448" cy="50" r="13" fill="#2F6FEB"/><text x="448" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text><text x="470" y="56" font-size="17" font-weight="650" fill="#1F2328">Self-checking</text><text x="436" y="86" font-size="14" fill="#59636E">see-frame returns PNG frames so</text><text x="436" y="106" font-size="14" fill="#59636E">the agent looks at its own work.</text><rect x="812" y="20" width="376" height="170" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1.5"/><circle cx="844" cy="50" r="13" fill="#2F6FEB"/><text x="844" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text><text x="866" y="56" font-size="17" font-weight="650" fill="#1F2328">Components</text><text x="832" y="86" font-size="14" fill="#59636E">Essential Properties, copies with</text><text x="832" y="106" font-size="14" fill="#59636E">new text and colours, a library.</text><rect x="20" y="210" width="376" height="170" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1.5"/><circle cx="52" cy="240" r="13" fill="#2F6FEB"/><text x="52" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text><text x="74" y="246" font-size="17" font-weight="650" fill="#1F2328">Real animation</text><text x="40" y="276" font-size="14" fill="#59636E">Few eased keys, text animators,</text><text x="40" y="296" font-size="14" fill="#59636E">expressions. Never frame by frame.</text><rect x="416" y="210" width="376" height="170" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1.5"/><circle cx="448" cy="240" r="13" fill="#2F6FEB"/><text x="448" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text><text x="470" y="246" font-size="17" font-weight="650" fill="#1F2328">Film building</text><text x="436" y="276" font-size="14" fill="#59636E">Scene plans, transitions, UI demo</text><text x="436" y="296" font-size="14" fill="#59636E">moves, charts, 3D cameras.</text><rect x="812" y="210" width="376" height="170" rx="12" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1.5"/><circle cx="844" cy="240" r="13" fill="#2F6FEB"/><text x="844" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">6</text><text x="866" y="246" font-size="17" font-weight="650" fill="#1F2328">Unattended runs</text><text x="832" y="276" font-size="14" fill="#59636E">A guard handles popups and</text><text x="832" y="296" font-size="14" fill="#59636E">stuck panels on macOS.</text></svg>
