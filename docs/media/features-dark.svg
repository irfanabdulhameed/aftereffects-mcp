<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8590"/></marker></defs><rect x="20" y="20" width="376" height="170" rx="12" fill="#121D2F" stroke="#4493F8" stroke-width="1.5"/><circle cx="52" cy="50" r="13" fill="#4493F8"/><text x="52" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text><text x="74" y="56" font-size="17" font-weight="650" fill="#F0F6FC">Batching</text><text x="40" y="86" font-size="14" fill="#9198A1">Many steps in one round-trip</text><text x="40" y="106" font-size="14" fill="#9198A1">and one undo step.</text><rect x="416" y="20" width="376" height="170" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="448" cy="50" r="13" fill="#4493F8"/><text x="448" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text><text x="470" y="56" font-size="17" font-weight="650" fill="#F0F6FC">Self-checking</text><text x="436" y="86" font-size="14" fill="#9198A1">see-frame returns PNG frames so</text><text x="436" y="106" font-size="14" fill="#9198A1">the agent looks at its own work.</text><rect x="812" y="20" width="376" height="170" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="844" cy="50" r="13" fill="#4493F8"/><text x="844" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text><text x="866" y="56" font-size="17" font-weight="650" fill="#F0F6FC">Components</text><text x="832" y="86" font-size="14" fill="#9198A1">Essential Properties, copies with</text><text x="832" y="106" font-size="14" fill="#9198A1">new text and colours, a library.</text><rect x="20" y="210" width="376" height="170" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="52" cy="240" r="13" fill="#4493F8"/><text x="52" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text><text x="74" y="246" font-size="17" font-weight="650" fill="#F0F6FC">Real animation</text><text x="40" y="276" font-size="14" fill="#9198A1">Few eased keys, text animators,</text><text x="40" y="296" font-size="14" fill="#9198A1">expressions. Never frame by frame.</text><rect x="416" y="210" width="376" height="170" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="448" cy="240" r="13" fill="#4493F8"/><text x="448" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text><text x="470" y="246" font-size="17" font-weight="650" fill="#F0F6FC">Film building</text><text x="436" y="276" font-size="14" fill="#9198A1">Scene plans, transitions, UI demo</text><text x="436" y="296" font-size="14" fill="#9198A1">moves, charts, 3D cameras.</text><rect x="812" y="210" width="376" height="170" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="844" cy="240" r="13" fill="#4493F8"/><text x="844" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">6</text><text x="866" y="246" font-size="17" font-weight="650" fill="#F0F6FC">Unattended runs</text><text x="832" y="276" font-size="14" fill="#9198A1">A guard handles popups and</text><text x="832" y="296" font-size="14" fill="#9198A1">stuck panels on macOS.</text></svg>
