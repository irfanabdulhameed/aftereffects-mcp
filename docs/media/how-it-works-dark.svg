<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7D8590"/></marker></defs><rect x="20" y="20" width="206" height="116" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="52" cy="50" r="13" fill="#4493F8"/><text x="52" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text><text x="74" y="56" font-size="17" font-weight="650" fill="#F0F6FC">You</text><text x="40" y="86" font-size="14" fill="#9198A1">Describe the motion</text><text x="40" y="106" font-size="14" fill="#9198A1">in plain words</text><path d="M230 78.0 H252" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><rect x="258" y="20" width="206" height="116" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="290" cy="50" r="13" fill="#4493F8"/><text x="290" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text><text x="312" y="56" font-size="17" font-weight="650" fill="#F0F6FC">AI agent</text><text x="278" y="86" font-size="14" fill="#9198A1">Claude Code or another</text><text x="278" y="106" font-size="14" fill="#9198A1">AI app plans the steps</text><path d="M468 78.0 H490" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><rect x="496" y="20" width="206" height="116" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="528" cy="50" r="13" fill="#4493F8"/><text x="528" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text><text x="550" y="56" font-size="17" font-weight="650" fill="#F0F6FC">MCP server</text><text x="516" y="86" font-size="14" fill="#9198A1">Checks every step</text><text x="516" y="106" font-size="14" fill="#9198A1">and passes it on</text><path d="M706 78.0 H728" fill="none" stroke="#7D8590" stroke-width="2" marker-end="url(#head)"/><rect x="734" y="20" width="206" height="116" rx="12" fill="#151B23" stroke="#3D444D" stroke-width="1.5"/><circle cx="766" cy="50" r="13" fill="#4493F8"/><text x="766" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text><text x="788" y="56" font-size="17" font-weight="650" fill="#F0F6FC">After Effects</text><text x="754" y="86" font-size="14" fill="#9198A1">A small panel builds it</text><text x="754" y="106" font-size="14" fill="#9198A1">in your open project</text><path d="M837.0 140 V188 H123.0 V144" fill="none" stroke="#7D8590" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#head)"/><text x="480" y="216" text-anchor="middle" font-size="14" fill="#9198A1">The result comes back: the agent looks at the frames it made, then tells you what it built.</text></svg>
