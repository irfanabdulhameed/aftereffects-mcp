name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Check generated docs are current
        if: runner.os == 'Linux'
        run: |
          npm run gen-docs
          git diff --exit-code -- docs/TOOLS.md || (echo "docs/TOOLS.md is out of date. Run npm run gen-docs and commit." && exit 1)
      - name: Check for em dashes and foreign usernames
        if: runner.os == 'Linux'
        run: |
          set -e
          if grep -rlP "\x{2014}" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=build . ; then echo "Em dash found"; exit 1; fi
          echo "No em dashes."
